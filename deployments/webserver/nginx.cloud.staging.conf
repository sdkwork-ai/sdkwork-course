# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/course/webserver.pid;
error_log /var/log/sdkwork/course/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name course-staging.sdkwork.com course-staging.birdcoder.com course-staging.dtupay.com course-staging.sdkwork.cn course-staging.birdcoder.cn course-staging.dtupay.cn course-staging.skubc.com course-staging.skubc.cn course-staging.zowalk.com course-staging.zowalk.cn course-staging.offer86.com course-staging.offer86.cn course-staging.86offer.com course-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
