# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/course/webserver.pid;
error_log /var/log/sdkwork/course/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name course-test.sdkwork.com course-test.birdcoder.com course-test.dtupay.com course-test.sdkwork.cn course-test.birdcoder.cn course-test.dtupay.cn course-test.skubc.com course-test.skubc.cn course-test.zowalk.com course-test.zowalk.cn course-test.offer86.com course-test.offer86.cn course-test.86offer.com course-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
