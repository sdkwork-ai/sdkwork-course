# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/course/webserver.pid;
error_log /var/log/sdkwork/course/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name course-demo.sdkwork.com course-demo.birdcoder.com course-demo.dtupay.com course-demo.noaper.com course-demo.sdkwork.cn course-demo.birdcoder.cn course-demo.dtupay.cn course-demo.noaper.cn course-demo.skubc.com course-demo.skubc.cn course-demo.zowalk.com course-demo.zowalk.cn course-demo.offer86.com course-demo.offer86.cn course-demo.86offer.com course-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
