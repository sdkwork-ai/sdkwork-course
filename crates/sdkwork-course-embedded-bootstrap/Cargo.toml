[package]
rust-version.workspace = true
name = "sdkwork-course-embedded-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded course application bootstrap for unified-process platform consumers."


[lints]
workspace = true
[lib]
name = "sdkwork_course_embedded_bootstrap"

[dependencies]
axum.workspace = true
async-trait = "0.1"
dotenvy = "0.15"
sdkwork_content_course_repository_sqlx.workspace = true
sdkwork_content_course_service.workspace = true
sdkwork-course-database-host = { workspace = true }
sdkwork-database-sqlx.workspace = true
sdkwork_routes_course_app_api = { workspace = true, package = "sdkwork-routes-course-app-api" }
sdkwork_routes_course_backend_api = { workspace = true, package = "sdkwork-routes-course-backend-api" }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde_json = "1.0"
sdkwork-utils-rust.workspace = true
sdkwork-drive-app-sdk-generated-rust.workspace = true
uuid = { version = "1.16", features = ["v4"] }
