[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-course-standalone-gateway",
    "crates/sdkwork-api-course-assembly",
    "crates/sdkwork-api-course-assembly",
    "crates/sdkwork-course-embedded-bootstrap",
    "crates/sdkwork-course-database-host",
    "crates/sdkwork-content-course-service",
    "crates/sdkwork-content-course-repository-sqlx",
    "crates/sdkwork-routes-course-http-auth",
    "crates/sdkwork-routes-course-app-api",
    "crates/sdkwork-routes-course-backend-api",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork_routes_course_http_auth = { path = "crates/sdkwork-routes-course-http-auth", package = "sdkwork-routes-course-http-auth" }

sdkwork_content_course_repository_sqlx = { path = "crates/sdkwork-content-course-repository-sqlx", package = "sdkwork-content-course-repository-sqlx" }

sdkwork_content_course_service = { path = "crates/sdkwork-content-course-service", package = "sdkwork-content-course-service" }

sdkwork_routes_course_backend_api = { path = "crates/sdkwork-routes-course-backend-api", package = "sdkwork-routes-course-backend-api" }

sdkwork_routes_course_app_api = { path = "crates/sdkwork-routes-course-app-api", package = "sdkwork-routes-course-app-api" }

sdkwork_course_embedded_bootstrap = { path = "crates/sdkwork-course-embedded-bootstrap", package = "sdkwork-course-embedded-bootstrap" }

sdkwork-api-course-assembly = { path = "crates/sdkwork-api-course-assembly" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
tracing = "0.1"
sdkwork-course-database-host = { path = "crates/sdkwork-course-database-host" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork_iam_context_service = { path = "../sdkwork-iam/crates/sdkwork-iam-context-service", package = "sdkwork-iam-context-service" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-drive-app-sdk-generated-rust = { path = "../sdkwork-drive/sdks/sdkwork-drive-app-sdk/sdkwork-drive-app-sdk-rust/generated/server-openapi", package = "sdkwork-drive-app-sdk-generated-rust" }
